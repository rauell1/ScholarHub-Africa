{% comment %}
Sticky mobile CTA (UX checklist #6).
Fixed to the bottom of the viewport on mobile only; hidden from md up.
Add `{% block body_class %}has-sticky-cta{% endblock %}` to the page <body>
so the CSS can add matching bottom padding.
{% endcomment %}
<div class="sticky-cta" aria-label="Quick actions">
  <a href="{% url 'scholarships:directory' %}" class="btn-primary flex-1 justify-center py-3">
    🎓 Find my scholarship
  </a>
  <a href="{% url 'scholarships:by_country' %}" class="btn-outline justify-center px-4 py-3"
     title="Browse by country" aria-label="Browse scholarships by country">🌍</a>
</div>
