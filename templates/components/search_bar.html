<!-- Search bar with Vanilla JS-powered live suggestions -->
<div id="search-container-{{ id|default:'main' }}" class="relative w-full">
  <form action="{% url 'scholarships:directory' %}" method="get" role="search">
    <label for="q-{{ id|default:'main' }}" class="sr-only">Search scholarships</label>
    <div class="relative">
      <input
        id="q-{{ id|default:'main' }}"
        type="search"
        name="q"
        value="{{ query|default:'' }}"
        placeholder="{{ placeholder|default:'Search scholarships, universities, countries...' }}"
        autocomplete="off"
        class="input {% if large %}py-4 text-base{% endif %} pr-12"
      >
      <button type="submit"
              class="absolute right-1.5 top-1/2 -translate-y-1/2 rounded-xl bg-teal px-4 py-2 text-sm font-semibold text-white shadow-md hover:bg-teal-light">
        Search
      </button>
    </div>
  </form>

  <div id="search-results-{{ id|default:'main' }}"
       class="hidden absolute left-0 right-0 top-full z-30 mt-2 max-h-96 overflow-y-auto rounded-2xl bg-card p-2 shadow-xl ring-1 ring-border">
    <!-- Results injected here -->
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('search-container-{{ id|default:"main" }}');
  const input = document.getElementById('q-{{ id|default:"main" }}');
  const resultsDiv = document.getElementById('search-results-{{ id|default:"main" }}');
  let timer = null;

  document.addEventListener('click', (e) => {
    if (!container.contains(e.target)) {
      resultsDiv.classList.add('hidden');
    }
  });

  input.addEventListener('input', (e) => {
    clearTimeout(timer);
    const value = e.target.value.trim();
    if (value.length < 2) {
      resultsDiv.innerHTML = '';
      resultsDiv.classList.add('hidden');
      return;
    }

    timer = setTimeout(async () => {
      try {
        const res = await fetch('/api/v1/search/?q=' + encodeURIComponent(value));
        const data = await res.json();
        const results = data.results || [];
        
        if (results.length > 0) {
          resultsDiv.innerHTML = results.map(r => `
            <a href="/scholarships/${r.slug}/" class="flex items-center justify-between gap-3 rounded-xl px-3 py-2.5 hover:bg-foreground/5">
              <span class="text-sm font-semibold text-foreground">${r.name}</span>
              <span class="shrink-0 text-xs text-foreground/50">${r.country_name} · ${r.score}/100</span>
            </a>
          `).join('');
          resultsDiv.classList.remove('hidden');
        } else {
          resultsDiv.classList.add('hidden');
        }
      } catch (e) {
        resultsDiv.classList.add('hidden');
      }
    }, 300);
  });
});
</script>
