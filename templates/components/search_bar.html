{% comment %}
Search bar with Alpine.js-powered live suggestions (System Design v1.0 §6.1).
Falls back to a plain GET form when JavaScript is unavailable.
{% endcomment %}
<div x-data="searchBar()" class="relative w-full" @click.outside="open = false">
  <form action="{% url 'scholarships:directory' %}" method="get" role="search">
    <label for="q-{{ id|default:'main' }}" class="sr-only">Search scholarships</label>
    <div class="relative">
      <input
        id="q-{{ id|default:'main' }}"
        type="search"
        name="q"
        x-model="q"
        @input="onInput"
        value="{{ query|default:'' }}"
        placeholder="{{ placeholder|default:'Search scholarships, universities, countries…' }}"
        autocomplete="off"
        class="input {% if large %}py-4 text-base{% endif %} pr-12"
      >
      <button type="submit"
              class="absolute right-1.5 top-1/2 -translate-y-1/2 rounded-lg bg-teal px-4 py-2 text-sm font-semibold text-navy hover:bg-teal-light">
        Search
      </button>
    </div>
  </form>

  <div x-show="open && results.length > 0" x-cloak
       class="absolute left-0 right-0 top-full z-30 mt-2 max-h-96 overflow-y-auto rounded-2xl bg-white p-2 shadow-xl ring-1 ring-navy/10">
    <template x-for="r in results" :key="r.slug">
      <a :href="'/scholarships/' + r.slug + '/'" class="flex items-center justify-between gap-3 rounded-xl px-3 py-2.5 hover:bg-gray-50">
        <span class="text-sm font-semibold text-navy" x-text="r.name"></span>
        <span class="shrink-0 text-xs text-navy/50" x-text="r.country_name + ' · ' + r.score + '/100'"></span>
      </a>
    </template>
  </div>
</div>

<script>
function searchBar() {
  return {
    q: '',
    results: [],
    open: false,
    timer: null,
    async onInput() {
      clearTimeout(this.timer);
      const value = this.q.trim();
      if (value.length < 2) { this.results = []; this.open = false; return; }
      this.timer = setTimeout(async () => {
        try {
          const res = await fetch('/api/v1/search/?q=' + encodeURIComponent(value));
          const data = await res.json();
          this.results = data.results || [];
          this.open = true;
        } catch (e) { this.results = []; }
      }, 300);
    }
  };
}
</script>
